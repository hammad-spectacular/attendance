<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('attendance-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator | The Eye</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ================================
       THEME VARIABLES
       ================================ */
    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #263348;
      --bg-input: #0f172a;
      --border: #334155;
      --border-focus: #4f46e5;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --primary-hover: #6366f1;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.1);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.08);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.08);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --gradient: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --table-row-hover: rgba(79, 70, 229, 0.06);
      --table-stripe: rgba(255, 255, 255, 0.02);
      --badge-bg: rgba(79, 70, 229, 0.12);
      --badge-text: #a5b4fc;
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --bg-input: #f8fafc;
      --border: #e2e8f0;
      --border-focus: #4f46e5;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --success-bg: rgba(34, 197, 94, 0.08);
      --danger: #dc2626;
      --danger-bg: rgba(239, 68, 68, 0.06);
      --warning: #d97706;
      --warning-bg: rgba(245, 158, 11, 0.06);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      --gradient: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --table-row-hover: rgba(79, 70, 229, 0.04);
      --table-stripe: rgba(0, 0, 0, 0.015);
      --badge-bg: rgba(79, 70, 229, 0.08);
      --badge-text: #4f46e5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    /* ================================
       HEADER (Admin-style gradient)
       ================================ */
    .header {
      background: var(--gradient);
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 30;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
    }

    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .header-inner {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 14px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-title strong {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .header-title span {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.06);
    }

    .header-menu-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-menu-toggle {
      display: none;
    }

    .header-menu-panel {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-menu-label {
      display: none;
    }

    /* ================================
       TAB NAVIGATION (Mobile Scrollable)
       ================================ */
    .tab-nav {
      background: var(--bg);
      border-bottom: 2px solid var(--border);
      border-top: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: background 0.3s ease, border-color 0.3s ease;
      margin-top: 2px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }

    .tab-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-nav {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    [data-theme="dark"] .tab-nav {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .tab-nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 0.5rem;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      width: max-content;
    }

    .subnav button {
      padding: 0.65rem 1.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-radius: 12px;
      border: 2px solid transparent;
      background: var(--bg-card);
      transition: all 0.25s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .subnav button:hover {
      color: var(--primary);
      background: var(--bg-card-hover);
      border-color: var(--border);
    }

    .subnav button.active {
      color: #fff;
      background: var(--gradient);
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }

    .tab-nav-toggle {
      display: none;
    }

    /* ================================
       MAIN CONTAINER
       ================================ */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .branch-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .branch-card h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .branch-name {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 6px 0 2px;
      color: var(--text);
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pill.active { background: var(--success-bg); color: var(--success); }
    .pill.flagged { background: var(--warning-bg); color: var(--warning); }
    .pill.deactivated { background: var(--danger-bg); color: var(--danger); }
    .pill.school-wide { background: var(--badge-bg); color: var(--badge-text); }

    .notice {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .notice.warn { background: var(--warning-bg); color: var(--warning); }
    .notice.danger { background: var(--danger-bg); color: var(--danger); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .panel h3 { margin: 0 0 4px; font-size: 0.95rem; }
    .panel p { margin: 0 0 14px; }
    .count { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }

    .muted { color: var(--text-muted); font-size: 0.82rem; }

    .list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    .list li {
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: border-color 0.3s ease;
    }
    .list li:last-child { border-bottom: none; }
    .empty { color: var(--text-muted); font-size: 0.84rem; padding: 8px 0; }
    .state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .state i { font-size: 2rem; opacity: 0.4; display: block; margin-bottom: 12px; }
    .state .msg { font-weight: 600; color: var(--text); margin-bottom: 4px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.2px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--gradient);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--bg-card-hover);
      color: var(--text-secondary);
    }

    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.active {
      background: var(--gradient);
      border-color: var(--primary);
      color: white;
    }

    /* ================================
       ATTENDANCE FILTERS (Admin style)
       ================================ */
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    .filters .fg {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 150px;
    }

    .filters label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .filters select, .filters input {
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.85rem;
      font-family: inherit;
      min-width: 100%;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
      outline: none;
    }

    .filters select:focus, .filters input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    .form-group textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .summary .chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ================================
       ATTENDANCE TABLE (Admin style)
       ================================ */
    .att-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .att-table th {
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .att-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .att-table tr:last-child td { border-bottom: none; }
    .att-table tbody tr:nth-child(even) { background: var(--table-stripe); }
    .att-table tbody tr:hover { background: var(--table-row-hover); }

    .status-btns { display: flex; gap: 8px; flex-wrap: wrap; }

    .status-btns button {
      border: 2px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      min-width: 80px;
    }

    .status-btns button:hover {
      border-color: var(--primary-light);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .status-btns button.st-present.active {
      background: var(--success);
      border-color: var(--success);
      color: white;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
    }

    .status-btns button.st-absent.active {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }

    .status-btns button.st-leave.active {
      background: var(--warning);
      border-color: var(--warning);
      color: white;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .status-badge.Present { background: var(--success-bg); color: var(--success); }
    .status-badge.Absent { background: var(--danger-bg); color: var(--danger); }
    .status-badge.Leave { background: var(--warning-bg); color: var(--warning); }
    .status-badge.none { background: var(--bg); color: var(--text-muted); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ================================
       STICKY SAVE BAR
       ================================ */
    .savebar {
      position: sticky;
      bottom: 0;
      background: var(--bg-card);
      border-top: 2px solid var(--warning);
      padding: 14px 0 4px;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
    }

    .savebar .dirty-note {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-group { margin-bottom: 22px; }
    .month-group h4 {
      margin: 0 0 10px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
    }

    /* ================================
       PASSWORD DIALOG
       ================================ */
    .modal-back {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-back.open { display: flex; }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: min(94vw, 420px);
      box-shadow: var(--shadow-lg);
      animation: modalSlideIn 0.3s ease-out;
    }

    .modal-card h3 {
      margin: 0 0 16px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .modal-card h3 i { color: var(--primary); }

    .modal-card .form-group { margin-bottom: 13px; }

    .modal-card label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .modal-card input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
    }

    .modal-card input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions .btn { flex: 1; justify-content: center; display: flex; }

    .form-msg {
      display: none;
      border-radius: 9px;
      padding: 10px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 10px;
    }

    .form-msg.error { display: block; background: var(--danger-bg); color: var(--danger); }
    .form-msg.success { display: block; background: var(--success-bg); color: var(--success); }

    .list-item {
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* ================================
       ANIMATIONS
       ================================ */
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(-10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================================
       MOBILE RESPONSIVE (Hamburger menu)
       ================================ */
    @media (max-width: 640px) {
      .header {
        padding: 16px;
      }

      .header-title strong {
        font-size: 1.1rem;
      }

      .main {
        padding: 16px 14px 50px;
      }

      .att-table th, .att-table td { padding: 9px 10px; }
      .att-table { min-width: 100%; }

      /* Roster order: 1=#, 2=Student Name, 3=Roll No., 4=Phone, 5=Status.
         Hide the row number and Roll No. so Name, Phone and Status stay readable. */
      .att-table th:nth-child(1), .att-table td:nth-child(1) { display: none; }
      .att-table th:nth-child(3), .att-table td:nth-child(3) { display: none; }

      .tab-nav {
        position: sticky;
        top: 72px;
        z-index: 25;
        margin-top: 0;
        overflow: visible;
      }

      .tab-nav-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 48px;
        padding: 0.55rem 0.9rem;
        margin: 0.5rem 0;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        background-color: var(--bg-card);
        border: 2px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
      }

      .tab-nav-toggle:hover {
        background-color: var(--bg-card-hover);
        border-color: var(--primary);
      }

      .tab-nav-toggle-icon {
        color: var(--text-muted);
        transition: transform 0.25s ease;
      }

      .tab-nav.open .tab-nav-toggle-icon {
        transform: rotate(90deg);
      }

      .tab-nav-inner {
        display: none;
        width: 100%;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.35rem 0;
        max-height: calc(100vh - 130px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .tab-nav.open .tab-nav-inner {
        display: flex;
      }

      .subnav button {
        width: 100%;
        min-height: 48px;
        padding: 0.7rem 0.95rem;
        font-size: 0.9rem;
        justify-content: flex-start;
      }

  <script>
const API_BASE = (typeof window !== 'undefined' && window.API_BASE) ? window.API_BASE : '';

// Theme toggle
function toggleTheme() {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  const current = html.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('attendance-theme', next);
  if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

// Apply saved theme on load
(function() {
  const saved = localStorage.getItem('attendance-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
})();

// Header menu toggle (hamburger on mobile)
function toggleHeaderMenu() {
  const wrap = document.getElementById('headerMenuWrap');
  const toggle = document.getElementById('headerMenuToggle');
  if (!wrap || !toggle) return;
  const isOpen = wrap.classList.toggle('open');
  toggle.setAttribute('aria-expanded', isOpen);
}

function closeHeaderMenu() {
  const wrap = document.getElementById('headerMenuWrap');
  const toggle = document.getElementById('headerMenuToggle');
  if (!wrap || !toggle) return;
  wrap.classList.remove('open');
  toggle.setAttribute('aria-expanded', 'false');
}

// Mobile tab navigation toggle
function setupMobileNavToggle() {
  const tabNav = document.getElementById('tabNav');
  const mobileToggle = document.getElementById('mobileNavToggle');
  if (!tabNav || !mobileToggle) return;
  
  mobileToggle.addEventListener('click', function() {
    const isOpen = tabNav.classList.toggle('open');
    this.setAttribute('aria-expanded', isOpen);
  });
  
  // Close on outside click
  document.addEventListener('click', function(e) {
    if (!tabNav.contains(e.target) && isOpen) {
      tabNav.classList.remove('open');
      mobileToggle.setAttribute('aria-expanded', 'false');
    }
  });
}

let isOpen = false;

let isRedirecting = false;

function authHeader() {
  const token = localStorage.getItem('auth_token');
  return token ? { Authorization: 'Bearer ' + token } : {};
}

function redirectToLogin() {
  if (isRedirecting) return;
  isRedirecting = true;
  localStorage.removeItem('auth_token');
  window.location.replace('/index.html');
}

async function refreshSession() {
  try {
    const res = await fetch(API_BASE + '/api/auth/me', { credentials: 'include', headers: authHeader() });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.token) localStorage.setItem('auth_token', data.token);
    return data;
  } catch (err) {
    return null;
  }
}

async function apiFetch(url, options = {}) {
  const fullUrl = url.startsWith('/api') ? API_BASE + url : url;
  const doFetch = () => fetch(fullUrl, {
    credentials: 'include',
    ...options,
    headers: { ...authHeader(), ...(options.headers || {}) }
  });

  let res = await doFetch();
  if (res.status === 401) {
    const session = await refreshSession();
    if (!session) { redirectToLogin(); return res; }
    res = await doFetch();
    if (res.status === 401) redirectToLogin();
  }
  return res;
}

function signOut() {
  localStorage.removeItem('auth_token');
  window.location.replace('/index.html');
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function listOrEmpty(items, emptyText) {
  if (!items || !items.length) return `<div class="empty">${escapeHtml(emptyText)}</div>`;
  return `<ul class="list">${items.map(i => `<li><i class="fas fa-circle-dot" style="opacity:.35;font-size:.5rem"></i>${escapeHtml(i.name)}</li>`).join('')}</ul>`;
}

function listOrEmptyWithDelete(items, emptyText, type) {
  if (!items || !items.length) return `<div class="empty">${escapeHtml(emptyText)}</div>`;
  return `<ul class="list">${items.map(i => `
    <li style="display:flex;align-items:center;justify-content:space-between;">
      <span><i class="fas fa-circle-dot" style="opacity:.35;font-size:.5rem"></i>${escapeHtml(i.name)}</span>
      <button class="btn-delete" onclick="delete${type.charAt(0).toUpperCase() + type.slice(1)}(${i.id})" style="width:24px;height:24px;padding:0;font-size:0.7rem;border-radius:6px;" title="Delete">
        <i class="fas fa-trash-alt"></i>
      </button>
    </li>`).join('')}</ul>`;
}

// The school's calendar day is authoritative for "today", not the device clock.
async function fetchSchoolToday() {
  try {
    const res = await apiFetch('/api/attendance/today');
    if (res.ok) {
      const data = await res.json();
      if (data && data.today) return data.today;
    }
  } catch (err) { /* fall through to device date */ }
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Karachi', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}

// =============================================================
// APP STATE
// =============================================================
let myClasses = [];          // classes of my branch, from /api/coordinator/me
let selectedClassId = null;
let selectedDate = null;     // YYYY-MM-DD for the Mark tab
let monthFilter = null;      // YYYY-MM for the Records tab
let recordsClassId = null;   // class filter for the Records tab ('all' or an id)
let attendanceState = {};    // { studentId: 'Present' | 'Absent' }
let baselineState = '{}';    // what was loaded from the server, for the dirty note
let savedRecords = [];       // month view rows
let attendanceDate = null;   // the date currently loaded in the Mark tab

// =============================================================
// LOAD
// =============================================================
async function load() {
  const app = document.getElementById('app');

  // A coordinator account is refused at login when credentials were not granted,
  // but a grant can be revoked while a session is live, so re-check on load.
  const res = await apiFetch('/api/coordinator/me');
  if (res.status === 403 || res.status === 401) {
    app.innerHTML = `<div class="state">
      <i class="fas fa-lock"></i>
      <div class="msg">No access</div>
      <div class="sub">${escapeHtml('Your account does not have access right now. Please contact your admin.')}</div>
    </div>`;
    return;
  }
  if (!res.ok) {
    app.innerHTML = `<div class="state"><i class="fas fa-triangle-exclamation"></i>
      <div class="msg">Could not load your branch</div>
      <div class="sub">Please try again.</div></div>`;
    return;
  }

  const data = await res.json();
  // branch is null when the coordinator is appointed to the whole school —
  // that is a normal state, not an error, and no branch card is shown for it.
  const branch = data.branch || null;
  const grants = data.grants || {};
  const profile = data.profile || {};

  document.getElementById('userName').textContent = profile.name || 'Coordinator';
  document.getElementById('userId').textContent = profile.login_id || '';

  myClasses = Array.isArray(data.classes) ? data.classes : [];
  selectedDate = await fetchSchoolToday();
  attendanceDate = selectedDate;

  // Hidden, not locked: a module the school has not granted is simply not shown.
  const banner = branch && branch.status === 'deactivated'
    ? `<div class="notice danger"><strong>This branch has been deactivated.</strong><br />
        ${escapeHtml(branch.deactivation_reason || 'Contact the Super Admin for details.')}<br />
        You can still view existing records, but no new ones can be added.</div>`
    : branch && branch.status === 'flagged'
      ? `<div class="notice warn">This branch has been flagged for review. Please contact your admin if something looks wrong.</div>`
      : '';

  // Only show management grid if there's data to display
  const hasClasses = myClasses.length > 0;
  const hasTeachers = grants.management && (data.teachers || []).length > 0;

  const management = (hasClasses || hasTeachers) ? `
    <div class="grid">
      ${hasClasses ? `
      <div class="panel">
        <h3>Classes</h3>
        <p class="muted">Classes added by your admin for this branch.</p>
        <div class="count">${myClasses.length}</div>
        ${listOrEmpty(myClasses, 'No classes yet')}
      </div>` : ''}
      ${hasTeachers ? `
      <div class="panel">
        <h3>Teachers</h3>
        <p class="muted">Teachers assigned to this branch.</p>
        <div class="count">${(data.teachers || []).length}</div>
        ${listOrEmptyWithDelete(data.teachers, 'No teachers yet', 'teacher')}
      </div>` : ''}
    </div>` : '';

  const noClassesNote = myClasses.length === 0
    ? `<div class="notice warn">Your branch has no classes yet. Ask your admin to add classes, then reload this page.</div>`
    : '';

  app.innerHTML = `
    ${banner}
    ${branch ? `
    <div class="branch-card">
      <h2>Your branch</h2>
      <div class="branch-name">${escapeHtml(branch.name || 'Unassigned')}</div>
      <span class="pill ${escapeHtml(branch.status || 'active')}">${escapeHtml(branch.status || 'active')}</span>
    </div>` : `
    <div class="branch-card">
      <h2>Your scope</h2>
      <div class="branch-name">Whole school</div>
      <span class="pill school-wide">School-wide</span>
    </div>`}
    <div class="subnav">
      <button id="navMark" class="active" onclick="switchSubTab('mark')"><i class="fas fa-clipboard-check"></i> Take attendance</button>
      <button id="navRecords" onclick="switchSubTab('records')"><i class="fas fa-clock-rotate-left"></i> Saved records</button>
      <button id="navAnnouncements" onclick="switchSubTab('announcements')"><i class="fas fa-bullhorn"></i> Announcements</button>
    </div>
    <div id="subMark">${noClassesNote}
      <div class="panel" style="margin-bottom:18px;">
        <div class="filters">
          <div class="fg">
            <label for="markClassSelect">Class</label>
            <select id="markClassSelect" onchange="onMarkClassChanged(this.value)">
              <option value="">-- Select class --</option>
              ${myClasses.map(c => `<option value="${c.id}"${c.section ? ` data-section="${escapeHtml(c.section)}"` : ''}>${escapeHtml(c.name)}${c.section ? ` (${escapeHtml(c.section)})` : ''}</option>`).join('')}
            </select>
          </div>
          <div class="fg">
            <label for="markDateInput">Date</label>
            <input type="date" id="markDateInput" value="${escapeHtml(selectedDate)}" max="${escapeHtml(selectedDate)}" onchange="onMarkDateChanged(this.value)">
          </div>
        </div>
        <div id="markSummary" class="summary" style="display:none;"></div>
        <div id="markTableWrap"><div class="empty">Select a class to load its students.</div></div>
        <div class="savebar" id="markSavebar" style="display:none;">
          <span class="dirty-note" id="dirtyNote"><i class="fas fa-circle-exclamation"></i> Unsaved changes</span>
          <button class="btn primary" id="saveAttBtn" onclick="submitAttendance()"><i class="fas fa-floppy-disk"></i> Save attendance</button>
        </div>
      </div>
    </div>
    <div id="subRecords" style="display:none;">
      <div class="panel">
        <div class="filters">
          <div class="fg" style="flex:1; min-width:200px;">
            <label for="recClassSelect">Class</label>
            <select id="recClassSelect" onchange="onRecordsFilterChanged()" style="width:100%;">

        <div class="filters" style="margin-top:10px;">

          <div id="announcementsList">
            <div class="empty">Loading announcements...</div>
          </div>
        </div>
      </div>

  // Setup mobile nav toggle after DOM is ready
  setupMobileNavToggle();
  closeMobileNav();

  if (myClasses.length > 0) {
    selectedClassId = myClasses[0].id;
    document.getElementById('markClassSelect').value = String(selectedClassId);
    recordsClassId = 'all';
    await loadMarkRoster();

function switchSubTab(which) {
  const mark = document.getElementById('subMark');
  const records = document.getElementById('subRecords');
  const announcements = document.getElementById('subAnnouncements');
  const navMark = document.getElementById('navMark');
  const navRecords = document.getElementById('navRecords');
  const navAnnouncements = document.getElementById('navAnnouncements');
  const mobileNavToggleLabel = document.getElementById('mobileNavToggleLabel');
  if (!mark || !records || !announcements) return;

  mark.style.display = which === 'mark' ? '' : 'none';
  records.style.display = which === 'records' ? '' : 'none';
  announcements.style.display = which === 'announcements' ? '' : 'none';

  navMark.classList.toggle('active', which === 'mark');
  navRecords.classList.toggle('active', which === 'records');
  navAnnouncements.classList.toggle('active', which === 'announcements');

  // Update mobile nav toggle label
  const labels = { mark: 'Take attendance', records: 'Saved records', announcements: 'Announcements' };
  if (mobileNavToggleLabel) mobileNavToggleLabel.textContent = labels[which] || 'Menu';

  // Close mobile nav on selection
  closeMobileNav();

  if (which === 'records') {
    populateRecPeriodFilters();
    loadRecords();
  } else if (which === 'announcements') {
    loadAnnouncements();
  }
}

function closeMobileNav() {
  const tabNav = document.getElementById('tabNav');
  const mobileToggle = document.getElementById('mobileNavToggle');
  if (tabNav) tabNav.classList.remove('open');
  if (mobileToggle) mobileToggle.setAttribute('aria-expanded', 'false');
}

// =============================================================
// TAKE ATTENDANCE
// =============================================================
function onMarkClassChanged(value) {
  selectedClassId = value ? parseInt(value, 10) : null;
  loadMarkRoster();
}

function onMarkDateChanged(value) {
  // Attendance cannot be taken for a future day; the server also enforces this.
  if (value) {
    const today = getTodayDate();
    if (value > today) {
      alert('Cannot take attendance for a future date. Please select today or a past date.');
      document.getElementById('markDateInput').value = selectedDate;
      return;
    }
    selectedDate = value;
    loadMarkRoster();
  }
}

async function loadMarkRoster() {
  const wrap = document.getElementById('markTableWrap');
  const summaryEl = document.getElementById('markSummary');
  const savebar = document.getElementById('markSavebar');
  if (!selectedClassId) {
    wrap.innerHTML = '<div class="empty">Select a class to load its students.</div>';
    summaryEl.style.display = 'none';
    savebar.style.display = 'none';
    return;
  }

  wrap.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading students…</div>';
  attendanceState = {};

  // Students of the class. The server confines this list to my branch.
  const studentsRes = await apiFetch(`/api/students?class_id=${selectedClassId}`);
  if (!studentsRes.ok) {
    wrap.innerHTML = '<div class="empty">Could not load students. Please reload the page.</div>';
    return;
  }
  const students = await studentsRes.json();

  // Already-saved attendance for the chosen date, so existing marks load back
  // and can be corrected on the same day.
  const attRes = await apiFetch(`/api/attendance?date=${encodeURIComponent(selectedDate)}&class_id=${selectedClassId}`);
  const saved = attRes.ok ? await attRes.json() : [];
  const savedByStudent = new Map(saved.map(r => [r.student_id, r.status]));
  attendanceDate = selectedDate;

  if (students.length === 0) {
    wrap.innerHTML = '<div class="empty">No students in this class yet.</div>';
    summaryEl.style.display = 'none';
    savebar.style.display = 'none';
    return;
  }

  for (const s of students) {
    const st = savedByStudent.get(s.id);
    // Only explicit records are restored. A student without a record shows as
    // unmarked — the system never treats "not taken" as absent.
    attendanceState[s.id] = (st === 'Present' || st === 'Absent' || st === 'Leave') ? st : null;
  }
  baselineState = JSON.stringify(attendanceState);

  // Get class info for display
  const selectedClass = myClasses.find(c => c.id === selectedClassId);
  const classDisplay = selectedClass ? escapeHtml(selectedClass.name) + (selectedClass.section ? ` - ${escapeHtml(selectedClass.section)}` : '') : '';

  wrap.innerHTML = `
    <div style="margin-bottom:12px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:0.85rem;font-weight:600;color:var(--text);">
      <i class="fas fa-book" style="margin-right:8px;color:var(--primary);"></i>${classDisplay}
    </div>
    <div class="table-scroll">
    <table class="att-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Student Name</th>
          <th>Roll No.</th>
          <th>Phone</th>
          <th style="text-align:right;">Status</th>
        </tr>
      </thead>
      <tbody>
        ${students.map((s, i) => `
          <tr data-student="${s.id}">
            <td>${i + 1}</td>
            <td style="font-weight:600;">${escapeHtml(s.name)}</td>
            <td>${s.roll_no != null ? escapeHtml(s.roll_no) : '—'}</td>
            <td class="muted">${escapeHtml(s.phone || '—')}</td>
            <td>
              <div class="status-btns" style="justify-content:flex-end;">
                <button class="st-present ${attendanceState[s.id] === 'Present' ? 'active' : ''}"
                        onclick="setStatus(${s.id}, 'Present', this)">Present</button>
                <button class="st-absent ${attendanceState[s.id] === 'Absent' ? 'active' : ''}"
                        onclick="setStatus(${s.id}, 'Absent', this)">Absent</button>
                <button class="st-leave ${attendanceState[s.id] === 'Leave' ? 'active' : ''}"
                        onclick="setStatus(${s.id}, 'Leave', this)">Leave</button>
              </div>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>`;
  summaryEl.style.display = 'flex';
  savebar.style.display = 'flex';
  updateMarkSummary();
}

function setStatus(studentId, status, btn) {
  // Attendance can be changed freely before saving; the server upserts on save.
  attendanceState[studentId] = attendanceState[studentId] === status ? null : status;
  const row = btn.closest('tr');
  row.querySelector('.st-present').classList.toggle('active', attendanceState[studentId] === 'Present');
  row.querySelector('.st-absent').classList.toggle('active', attendanceState[studentId] === 'Absent');
  row.querySelector('.st-leave').classList.toggle('active', attendanceState[studentId] === 'Leave');
  updateMarkSummary();
}

function updateMarkSummary() {
  const summaryEl = document.getElementById('markSummary');
  const savebar = document.getElementById('markSavebar');
  const dirtyNote = document.getElementById('dirtyNote');
  const values = Object.values(attendanceState);
  const present = values.filter(v => v === 'Present').length;
  const absent = values.filter(v => v === 'Absent').length;
  const unmarked = values.filter(v => v === null).length;
  const marked = present + absent;
  summaryEl.innerHTML = `
    <button class="status-btns st-present" style="pointer-events:none; cursor:default;">✅ Present: ${present}</button>
    <button class="status-btns st-absent" style="pointer-events:none; cursor:default;">❌ Absent: ${absent}</button>
    <button class="status-btns" style="pointer-events:none; cursor:default; border-color:var(--border); color:var(--text-muted);">⭕ Not marked: ${unmarked}</button>`;
  // A saved day that is re-opened starts clean; edits light the unsaved note up.
  if (dirtyNote) {
    dirtyNote.style.display = JSON.stringify(attendanceState) !== baselineState ? 'block' : 'none';
  }
  if (savebar) savebar.style.display = 'flex';
}

async function submitAttendance() {
  const btn = document.getElementById('saveAttBtn');
  if (!selectedClassId || !selectedDate) return;
  const records = Object.entries(attendanceState)
    .filter(([, status]) => status === 'Present' || status === 'Absent')
    .map(([studentId, status]) => ({ student_id: Number(studentId), status }));
  if (records.length === 0) {
    alert('Mark at least one student as Present or Absent before saving.');
    return;
  }

  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
  try {
    const res = await apiFetch('/api/attendance/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: selectedDate, records })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(data.error || 'Could not save attendance.');
      return;
    }
    // Reload so the summary reflects exactly what the server stored.
    await loadMarkRoster();
    // Show success confirmation
    const savebar = document.getElementById('markSavebar');
    const successMsg = document.createElement('span');
    successMsg.id = 'attendanceSavedMsg';
    successMsg.innerHTML = '<i class="fas fa-check-circle" style="color:var(--success);"></i> Attendance saved successfully!';
    successMsg.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:600;color:var(--success);padding:8px 12px;background:var(--success-bg);border-radius:8px;margin-right:auto;';
    savebar.insertBefore(successMsg, savebar.firstChild);
    // Remove after 3 seconds
    setTimeout(() => { if (successMsg.parentNode) successMsg.remove(); }, 3000);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// =============================================================
// SAVED RECORDS (month view)
// =============================================================
const REC_MONTH_NAMES = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'
];

function getTodayDate() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Karachi', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}

function populateRecPeriodFilters() {
  const daySel = document.getElementById('recDaySelect');
  const monthSel = document.getElementById('recMonthSelect');
  const yearSel = document.getElementById('recYearSelect');
  if (!daySel || !monthSel || !yearSel) return;

  const today = getTodayDate();
  const thisYear = today.slice(0, 4);
  const thisMonth = today.slice(5, 7);

  const years = new Set([thisYear]);
  for (let i = 1; i <= 3; i++) years.add(String(Number(thisYear) - i));

  yearSel.innerHTML = '<option value="">All Years</option>';
  [...years].sort((a, b) => b - a).forEach(y => {
    const o = document.createElement('option');
    o.value = y;
    o.textContent = y;
    yearSel.appendChild(o);
  });

  monthSel.innerHTML = '<option value="">All Months</option>';
  REC_MONTH_NAMES.forEach((name, i) => {
    const value = String(i + 1).padStart(2, '0');
    const o = document.createElement('option');
    o.value = value;
    o.textContent = name;
    monthSel.appendChild(o);
  });

  daySel.innerHTML = '<option value="">All Days</option>';
  for (let d = 1; d <= 31; d++) {
    const value = String(d).padStart(2, '0');
    const o = document.createElement('option');
    o.value = value;
    o.textContent = String(d);
    daySel.appendChild(o);
  }
}

function onRecordsFilterChanged() {
  populateRecPeriodFilters();
  loadRecords();
}

async function loadRecords() {
  const wrap = document.getElementById('recordsWrap');
  const day = document.getElementById('recDaySelect')?.value || '';
  const month = document.getElementById('recMonthSelect')?.value || '';
  const year = document.getElementById('recYearSelect')?.value || '';

  wrap.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading records…</div>';

  // Branch-scoped server-side: a coordinator always gets their own branch back.
  const res = await apiFetch('/api/attendance/all');
  if (!res.ok) {
    wrap.innerHTML = '<div class="empty">Could not load saved records. Please try again.</div>';
    return;
  }
  const all = await res.json();
  const cls = document.getElementById('recClassSelect').value;
  recordsClassId = cls || 'all';
  
  savedRecords = all.filter(r => {
    const d = String(r.date || '');
    const matchesDay = !day || d.slice(8, 10) === day;
    const matchesMonth = !month || d.slice(5, 7) === month;
    const matchesYear = !year || d.slice(0, 4) === year;
    const matchesClass = recordsClassId === 'all' || String(r.class_id) === String(recordsClassId);
    return matchesDay && matchesMonth && matchesYear && matchesClass;
  });

  if (savedRecords.length === 0) {
    wrap.innerHTML = '<div class="empty">No saved attendance for the selected filters.</div>';
    return;
  }

  // Group rows by date, then by class, so a whole day reads as one block.
  const byDate = new Map();
  for (const r of savedRecords) {
    if (!byDate.has(r.date)) byDate.set(r.date, []);
    byDate.get(r.date).push(r);
  }
  const dates = [...byDate.keys()].sort((a, b) => b.localeCompare(a));

  wrap.innerHTML = dates.map(d => {
    const rows = byDate.get(d);
    const byClass = new Map();
    for (const r of rows) {
      const key = r.class_name || 'No class';
      if (!byClass.has(key)) byClass.set(key, []);
      byClass.get(key).push(r);
    }
    return `
      <div class="month-group">
        <h4><i class="fas fa-calendar-day" style="opacity:.5;"></i> ${escapeHtml(d)}</h4>
        ${[...byClass.entries()].map(([className, recs]) => `
          <div class="panel" style="margin-bottom:12px;">
            <h3>${escapeHtml(className)}${recs[0].class_section ? ` <span class="badge" style="background:var(--badge-bg); color:var(--badge-text); font-size:0.7rem; margin-left:6px;">${escapeHtml(recs[0].class_section)}</span>` : ''}</h3>
            <p class="muted">${recs.filter(r => r.status === 'Present').length} present · ${recs.filter(r => r.status === 'Absent').length} absent · marked by ${escapeHtml(recs[0].marked_by || '—')}</p>
            <div class="table-scroll">
            <table class="att-table">
              <thead><tr><th>Student</th><th>Status</th></tr></thead>
              <tbody>
                ${recs.map(r => `
                  <tr>
                    <td style="font-weight:600;">${escapeHtml(r.name)}${r.roll_no != null ? ` <span class="muted">(#${escapeHtml(r.roll_no)})</span>` : ''}</td>
                    <td><span class="status-badge ${escapeHtml(r.status)}">${escapeHtml(r.status)}</span></td>
                  </tr>`).join('')}
              </tbody>
            </table>
            </div>
          </div>`).join('')}
      </div>`;
  }).join('');
}

// =============================================================
// CHANGE PASSWORD
// =============================================================
function openPasswordModal() {
  const modal = document.getElementById('passwordModal');
  document.getElementById('pwMsg').className = 'form-msg';
  // First login (a generated password) does not need the current password,
  // matching the server's rule of only requiring it for later changes.
  const isFirstLogin = new URLSearchParams(location.search).get('first') === '1';
  document.getElementById('currentPwGroup').style.display = isFirstLogin ? 'none' : '';
  document.getElementById('currentPw').required = !isFirstLogin;
  document.getElementById('newPw').value = '';
  document.getElementById('confirmPw').value = '';
  document.getElementById('currentPw').value = '';
  modal.classList.add('open');
  document.getElementById(isFirstLogin ? 'newPw' : 'currentPw').focus();
}

function closePasswordModal() {
  document.getElementById('passwordModal').classList.remove('open');
}

async function handleChangePassword(e) {
  e.preventDefault();
  const msgEl = document.getElementById('pwMsg');
  const btn = document.getElementById('pwSubmitBtn');
  const newPw = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  const current = document.getElementById('currentPw').value;

  msgEl.className = 'form-msg';
  if (newPw !== confirm) { msgEl.textContent = 'New passwords do not match'; msgEl.className = 'form-msg error'; return; }
  if (newPw.length < 8) { msgEl.textContent = 'Password must be at least 8 characters'; msgEl.className = 'form-msg error'; return; }
  if (!/[!@#$%^&*(),.?":{}|<>]/.test(newPw)) {
    msgEl.textContent = 'Password must contain at least one special character (!@#$%^&*(),.?":{}|<>)';
    msgEl.className = 'form-msg error';
    return;
  }

  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Saving…';
  try {
    const body = { new_password: newPw, confirm_password: confirm };
    if (document.getElementById('currentPwGroup').style.display !== 'none') {
      body.current_password = current;
    }
    const res = await apiFetch('/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msgEl.textContent = data.error || 'Failed to change password';
      msgEl.className = 'form-msg error';
      return;
    }
    if (data.token) localStorage.setItem('auth_token', data.token);
    msgEl.textContent = 'Password changed successfully';
    msgEl.className = 'form-msg success';
    setTimeout(closePasswordModal, 1200);
  } catch (err) {
    msgEl.textContent = 'Connection error. Please check your internet and try again.';
    msgEl.className = 'form-msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// =============================================================
// ANNOUNCEMENTS
// =============================================================
async function saveAnnouncement() {
  const textEl = document.getElementById('announcementText');
  const message = textEl.value.trim();
  if (!message) {
    alert('Please enter an announcement message');
    return;
  }

  try {
    const res = await apiFetch('/api/announcements', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, author: 'Coordinator' })
    });
    if (!res.ok) throw new Error('Failed to save announcement');
    textEl.value = '';
    loadAnnouncements();
  } catch (err) {
    alert('Error saving announcement: ' + err.message);
  }
}

async function loadAnnouncements() {
  const wrap = document.getElementById('announcementsList');
  if (!wrap) return;

  try {
    const res = await apiFetch('/api/announcements');
    if (!res.ok) throw new Error('Failed to load announcements');
    const announcements = await res.json();

    if (!announcements || announcements.length === 0) {
      wrap.innerHTML = '<div class="empty">No announcements yet</div>';
      return;
    }

    wrap.innerHTML = announcements.map(a => `
      <div class="list-item" style="padding:12px; border-bottom:1px solid var(--border);">
        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:4px;">
          ${new Date(a.created_at).toLocaleDateString()} ${a.author ? '• ' + escapeHtml(a.author) : ''}
        </div>
        <div style="font-size:0.9rem; color:var(--text);">${escapeHtml(a.message)}</div>
        <button class="btn" style="margin-top:8px; padding:4px 10px; font-size:0.75rem;" onclick="deleteAnnouncement(${a.id})">Delete</button>
      </div>
    `).join('');
  } catch (err) {
    wrap.innerHTML = '<div class="empty">Failed to load announcements</div>';
  }
}

async function deleteAnnouncement(id) {
  if (!confirm('Delete this announcement?')) return;

  try {
    const res = await apiFetch(`/api/announcements/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('Failed to delete');
    loadAnnouncements();
  } catch (err) {
    alert('Error deleting announcement: ' + err.message);
  }
}

load();
startKeepAlive();

function startKeepAlive() {
  refreshSession();
  setInterval(refreshSession, 10 * 60 * 1000);
}
