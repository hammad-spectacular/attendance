<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify recovery email — The Eye</title><style>body{font-family:system-ui;background:#f1f5f9;color:#172033;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:420px;background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px #0f172a22;text-align:center}a{color:#4338ca}</style></head><body><main class="card"><h1>Verify recovery email</h1><p id="message">Verifying your email address…</p><p><a href="/index.html">Back to sign in</a></p></main><script>(async()=>{const token=new URLSearchParams(location.search).get('token');const message=document.getElementById('message');if(!token){message.textContent='This verification link is invalid or has expired.';return}try{const response=await fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const data=await response.json();message.textContent=response.ok?data.message:(data.error||'This verification link is invalid or has expired.')}catch(_){message.textContent='Unable to verify the email. Please try again later.'}})()</script></body></html>
