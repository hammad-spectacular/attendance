<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function() {
    const saved = localStorage.getItem('attendance-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — The Eye</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
[data-theme="dark"] {
  --bg: #0f172a; --bg-card: #1e293b; --border: #334155;
  --text: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
  --primary: #4f46e5; --primary-light: #818cf8;
  --success: #22c55e; --danger: #ef4444;
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.4);
  --gradient: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
}
[data-theme="light"] {
  --bg: #f1f5f9; --bg-card: #ffffff; --border: #e2e8f0;
  --text: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
  --primary: #4f46e5; --primary-light: #6366f1;
  --success: #16a34a; --danger: #dc2626;
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
  --gradient: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.4s ease;
}
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; padding: 40px 36px;
  width: 90%; max-width: 420px;
  box-shadow: var(--shadow-lg); animation: fadeInUp 0.5s ease-out;
}
.header { text-align: center; margin-bottom: 28px; }
.header .icon {
  width: 56px; height: 56px;
  background: var(--gradient); border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 1.5rem; color: white;
  box-shadow: 0 4px 12px rgba(79,70,229,0.3);
}
.header h1 { font-size: 1.3rem; font-weight: 800; }
.header p { font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 0.75rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-secondary); margin-bottom: 6px;
}
.form-group input {
  width: 100%; padding: 12px 14px;
  border-radius: 10px; border: 2px solid var(--border);
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 0.9rem;
  outline: none; transition: border-color 0.25s ease;
}
.form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
.btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  background: var(--gradient); color: white;
  font-family: 'Inter', sans-serif; font-size: 0.9rem;
  font-weight: 700; cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 12px rgba(79,70,229,0.3);
  margin-top: 4px;
}
.btn:hover { box-shadow: 0 6px 18px rgba(79,70,229,0.45); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.msg {
  padding: 10px 14px; border-radius: 10px;
  font-size: 0.8rem; font-weight: 500; margin-top: 12px;
  display: none; text-align: center;
}
.msg.show { display: block; }
.msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: var(--danger); }
.msg.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); color: var(--success); }
.spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle; }
.back-link {
  text-align: center; margin-top: 22px;
  font-size: 0.8rem; color: var(--text-muted);
}
.back-link a { color: var(--primary-light); text-decoration: none; font-weight: 600; }
.back-link a:hover { text-decoration: underline; }
.error-card {
  text-align: center;
}
.error-card .icon {
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
}
.theme-toggle {
  position: fixed; top: 20px; right: 20px;
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; z-index: 10;
}
.theme-toggle:hover { border-color: var(--primary); color: var(--primary); transform: rotate(20deg); }
@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width:480px) { .card { padding: 28px 20px; } }
</style>
    <link rel="stylesheet" href="ui-buttons.css">
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
  <i class="fas fa-moon" id="themeIcon"></i>
</button>

<!-- Invalid/missing token view -->
<div class="card" id="invalidTokenCard" style="display:none;">
  <div class="header error-card">
    <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
    <h1>Invalid Link</h1>
    <p>This password reset link is invalid or has expired.</p>
  </div>
  <div class="back-link">
    <a href="/forgot-password.html">Request a new reset link</a><br><br>
    <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<!-- Reset form view -->
<div class="card" id="resetFormCard">
  <div class="header">
    <div class="icon"><i class="fas fa-key"></i></div>
    <h1>Reset Password</h1>
    <p>Enter your new password below</p>
  </div>

  <form id="resetForm" onsubmit="handleResetPassword(event)">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters with special character" required minlength="8">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
    </div>

    <div class="msg" id="statusMsg"></div>

    <button type="submit" class="btn" id="submitBtn">
      <span id="btnText">Reset Password</span>
    </button>
  </form>

  <div class="back-link">
    <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  localStorage.setItem('attendance-theme', isDark ? 'light' : 'dark');
}
(function() {
  const saved = localStorage.getItem('attendance-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
})();

// Extract token from URL
const urlParams = new URLSearchParams(window.location.search);
const resetToken = urlParams.get('token');

if (!resetToken) {
  document.getElementById('resetFormCard').style.display = 'none';
  document.getElementById('invalidTokenCard').style.display = 'block';
}

async function handleResetPassword(e) {
  e.preventDefault();
  const newPw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const msgEl = document.getElementById('statusMsg');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  msgEl.classList.remove('show', 'error', 'success');

  if (newPw !== confirm) {
    msgEl.textContent = 'Passwords do not match';
    msgEl.className = 'msg error show';
    return;
  }
  if (newPw.length < 8) {
    msgEl.textContent = 'Password must be at least 8 characters';
    msgEl.className = 'msg error show';
    return;
  }
  const specialChars = /[!@#$%^&*(),.?":{}|<>]/;
  if (!specialChars.test(newPw)) {
    msgEl.textContent = 'Password must contain at least one special character (!@#$%^&*(),.?":{}|<>)';
    msgEl.className = 'msg error show';
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Resetting...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: resetToken,
        new_password: newPw,
        confirm_password: confirm
      })
    });
    const data = await res.json();

    if (!res.ok) {
      msgEl.textContent = data.error || 'Failed to reset password.';
      msgEl.className = 'msg error show';
      btn.disabled = false;
      btnText.textContent = 'Reset Password';
      return;
    }

    msgEl.textContent = 'Password reset successfully! Redirecting to login...';
    msgEl.className = 'msg success show';
    btn.style.display = 'none';

    setTimeout(() => {
      window.location.href = '/index.html';
    }, 1500);
  } catch (err) {
    msgEl.textContent = 'Connection error. Please check your internet and try again.';
    msgEl.className = 'msg error show';
    btn.disabled = false;
    btnText.textContent = 'Reset Password';
  }
}
</script>
</body>
</html>
