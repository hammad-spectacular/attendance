<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Khattack Academy — Sign in</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./design-tokens.css">
<link rel="stylesheet" href="./auth-hero.css">
<style>
.hero-title {
  font-size: clamp(2rem, min(4.2vw, 6.5vh), 3.5rem);
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.02em;
  max-width: 19ch;
  text-wrap: balance;
  color: #FFFFFF;
  margin-bottom: 14px;
}

.hero-sub {
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink-2-on-dark, #C4C4BC);
  max-width: 48ch;
  margin-bottom: 28px;
}

.forgot-row {
  display: flex;
  justify-content: flex-end;
  margin: -4px 0 16px;
}

.forgot-link {
  font-size: 13px;
  font-weight: 500;
  color: var(--accent, #E6F27A);
  text-decoration: none;
}

.forgot-link:hover {
  text-decoration: underline;
}

.forgot-link:focus-visible {
  outline: 2px solid var(--accent, #E6F27A);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Corner Symbolic Nodes */
.corner-node {
  position: absolute;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 15;
}

.corner-circle {
  width: 56px;
  height: 56px;
  border-radius: 999px;
  background: #161615;
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #E6F27A;
  font-size: 24px;
  position: relative;
}

.corner-label {
  font-size: 13px;
  font-weight: 500;
  color: #D6D6CF;
}

.corner-connector {
  position: absolute;
  top: 50%;
  width: 64px;
  height: 1px;
  pointer-events: none;
}

.corner-node.left .corner-connector {
  left: calc(100% + 10px);
  background: linear-gradient(to right, rgba(255, 255, 255, 0.2), transparent);
}

.corner-node.right .corner-connector {
  right: calc(100% + 10px);
  background: linear-gradient(to left, rgba(255, 255, 255, 0.2), transparent);
}

@media (min-width: 1200px) {
  .corner-node {
    display: flex;
  }
  .corner-node.tl { top: 96px; left: 32px; }
  .corner-node.tr { top: 96px; right: 32px; }
  .corner-node.bl { bottom: 32px; left: 32px; }
  .corner-node.br { bottom: 32px; right: 32px; }
}

@media (max-width: 767px) {
  .corner-node.tl,
  .corner-node.tr {
    display: flex;
    top: auto;
    bottom: 16px;
  }
  .corner-node.tl { left: 16px; }
  .corner-node.tr { right: 16px; }
  .corner-circle {
    width: 40px;
    height: 40px;
    font-size: 16px;
  }
  .corner-label {
    font-size: 11px;
  }
  .corner-connector {
    display: none;
  }
  .hero-main {
    padding-bottom: 76px;
  }
}

@media (max-height: 780px) and (min-width: 768px) {
  .hero-main {
    padding: 16px 0;
  }
  .hero-sub {
    margin-bottom: 20px;
  }
}
</style>
</head>
<body>

<div class="hero-panel">
  <!-- Clipped Sage-Mint + Lime Glow Layer -->
  <div class="hero-glow-layer" aria-hidden="true">
    <div class="hero-glow-top"></div>
    <div class="hero-glow-bottom"></div>
    <div class="hero-glow-lime"></div>
    <div class="hero-scrim"></div>
  </div>

  <!-- Sticky Floating Pill Navbar -->
  <header class="hero-nav-wrap">
    <nav class="hero-nav" aria-label="Primary navigation">
      <a href="/" class="nav-brand">
        <span class="nav-logo-mark" aria-hidden="true">KA</span>
        <span class="nav-brand-name">Khattack Academy</span>
      </a>
      <a href="./register.html" class="nav-register-btn">
        <span class="label-full">Register your school</span>
        <span class="label-short">Register</span>
      </a>
    </nav>
  </header>

  <!-- Corner Symbolic Nodes -->
  <div class="corner-node left tl" aria-hidden="true">
    <div class="corner-circle">
      <i class="fas fa-eye"></i>
      <span class="corner-connector"></span>
    </div>
    <span class="corner-label">Insight</span>
  </div>
  <div class="corner-node right tr" title="Secure sign-in" aria-label="Secure sign-in">
    <div class="corner-circle">
      <i class="fas fa-lock" aria-hidden="true"></i>
      <span class="corner-connector" aria-hidden="true"></span>
    </div>
    <span class="corner-label">Secure</span>
  </div>
  <div class="corner-node left bl" aria-hidden="true">
    <div class="corner-circle">
      <i class="fas fa-wallet"></i>
      <span class="corner-connector"></span>
    </div>
    <span class="corner-label">Fees</span>
  </div>
  <div class="corner-node right br" aria-hidden="true">
    <div class="corner-circle">
      <i class="fas fa-users"></i>
      <span class="corner-connector"></span>
    </div>
    <span class="corner-label">Staff</span>
  </div>

  <!-- Vertically Centered Hero Block -->
  <main class="hero-main">
    <h1 class="hero-title">Run your whole school from one place</h1>
    <p class="hero-sub">Attendance, fees, exams and staff in one place.</p>

    <section class="auth-card" aria-label="Sign in">
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="fullId" class="sr-only">Full ID</label>
          <div class="input-wrap">
            <input type="text" id="fullId" class="auth-input" placeholder="Full ID" autocomplete="username" inputmode="text" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="sr-only">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" class="auth-input" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <div class="auth-msg error" id="loginError" role="alert">
          <i class="fas fa-circle-exclamation" style="margin-top:2px;flex-shrink:0;" aria-hidden="true"></i>
          <span id="loginErrorText"></span>
        </div>

        <button type="submit" class="lime-pill-btn" id="loginBtn">
          Sign in
        </button>
      </form>
    </section>
  </main>
</div>

<script src="/api-config.js"></script>
<script src="/auth-utils.js"></script>
<script>
(function () {
  const fullIdInput = document.getElementById('fullId');
  const pwInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const toggleBtn = document.getElementById('togglePw');
  const errorEl = document.getElementById('loginError');
  const errorTextEl = document.getElementById('loginErrorText');

  if (window.innerWidth >= 1024) {
    fullIdInput.focus();
  }

  toggleBtn.addEventListener('click', function () {
    const isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    this.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  function showError(msg) {
    errorTextEl.textContent = msg;
    errorEl.classList.add('show');
  }

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fullId = fullIdInput.value.trim();
    const password = pwInput.value;

    errorEl.classList.remove('show');
    errorTextEl.textContent = '';

    if (!fullId) {
      showError('Enter your Full ID.');
      fullIdInput.focus();
      return;
    }
    if (fullId !== 'SUPER-ADM' && fullId.indexOf('-') === -1) {
      showError('Invalid ID format. Your ID should look like HARV-T001.');
      fullIdInput.focus();
      return;
    }
    if (!password) {
      showError('Enter your password.');
      pwInput.focus();
      return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Signing in...';

    try {
      const { ok, data } = await apiLogin(fullId, password);

      if (!ok) {
        showError((data && data.error) ? data.error : 'Wrong Full ID or password. Try again.');
        pwInput.value = '';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
        pwInput.focus();
        return;
      }

      if (data.token) setAuthToken(data.token);
      window.location.replace(data.redirect_url || '/');
    } catch (err) {
      const msg = (typeof formatFetchError === 'function')
        ? formatFetchError(err)
        : "Can't reach the server. Check your connection.";
      showError(msg);
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
